<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>概念稿 — 小黑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+TC:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0e0c;
  --bg-soft:#15130f;
  --bg-card:#181613;
  --line:#2a2620;
  --line-soft:#1f1c17;
  --ink:#f3ede2;
  --ink-mute:#a39c8e;
  --ink-dim:#6b6557;
  --accent:#b8956a;
  --accent-hi:#d4b486;
  --serif:'Cormorant Garamond','Noto Serif TC',serif;
  --serif-cjk:'Noto Serif TC',serif;
  --sans:'Inter','Noto Sans TC',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-weight:300;
  line-height:1.6;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

/* ── 概念稿標示 ── */
.concept-badge{
  position:fixed;top:14px;right:14px;z-index:999;
  background:rgba(184,149,106,0.15);
  border:1px solid var(--accent);
  color:var(--accent-hi);
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;
  padding:6px 12px;
  backdrop-filter:blur(8px);
}

.grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.04;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.6'/></svg>")}
.aurora{position:fixed;inset:-20%;pointer-events:none;z-index:0;background:radial-gradient(40% 35% at 18% 22%, rgba(184,149,106,0.08), transparent 60%),radial-gradient(35% 30% at 82% 78%, rgba(184,149,106,0.05), transparent 60%);filter:blur(20px);animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-3%,2%) scale(1.05)}}

.shell{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,56px)}

/* ====== top bar ====== */
.top{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(14px);background:rgba(15,14,12,0.55);border-bottom:1px solid transparent}
.top-inner{max-width:1180px;margin:0 auto;padding:18px clamp(20px,5vw,56px);display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;font-family:var(--serif);font-size:22px;font-style:italic}
.brand-mark{width:32px;height:32px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--serif-cjk);font-size:18px;font-style:normal;color:var(--accent)}
.top-meta{font-family:var(--mono);font-size:11px;color:var(--ink-dim);letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;gap:14px}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(184,149,106,.45)}70%{box-shadow:0 0 0 8px rgba(184,149,106,0)}100%{box-shadow:0 0 0 0 rgba(184,149,106,0)}}

/* ====== HERO — 改動重點 ====== */
.hero{
  min-height:100vh;
  padding:100px 0 0;
  display:flex;
  flex-direction:column;
}

/* 上半：原本的兩欄 */
.hero-main{
  flex:1;
  display:grid;
  grid-template-columns:1fr 0.85fr; /* 肖像縮小 15% */
  gap:clamp(40px,7vw,90px);
  align-items:center;
  padding-bottom:60px;
}

.hero-tag{font-family:var(--mono);font-size:11px;color:var(--ink-dim);letter-spacing:.24em;text-transform:uppercase;display:flex;align-items:center;gap:14px;margin-bottom:26px}
.hero-tag::before{content:"";width:36px;height:1px;background:var(--ink-dim)}
.hero-title{font-family:var(--serif-cjk);font-size:clamp(64px,11vw,130px);font-weight:300;line-height:.92;letter-spacing:-.01em;color:var(--ink);margin-bottom:34px}
.hero-title .ch{display:inline-block;opacity:0;transform:translateY(28px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.hero-title .ch:nth-child(1){animation-delay:.1s}
.hero-title .ch:nth-child(2){animation-delay:.22s}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
.hero-sub{font-family:var(--serif);font-style:italic;font-size:clamp(18px,2.2vw,24px);font-weight:400;color:var(--ink-mute);margin-bottom:28px;max-width:36ch;line-height:1.4}
.hero-body{max-width:42ch;color:var(--ink-mute);font-size:14px;line-height:1.85;margin-bottom:36px}
.hero-body strong{color:var(--ink);font-weight:500}

/* ── 肖像縮小版 ── */
.portrait{position:relative;aspect-ratio:4/5;overflow:hidden}
.portrait-frame{position:absolute;inset:0;border:1px solid var(--line)}
.portrait-img{position:absolute;inset:14px;background:var(--bg-card);overflow:hidden}
.portrait-img img{width:100%;height:100%;object-fit:cover;filter:grayscale(.2) contrast(1.02) brightness(.95);transition:filter .8s,transform 1.2s}
.portrait:hover .portrait-img img{filter:grayscale(0) contrast(1.05) brightness(1);transform:scale(1.02)}
.portrait-caption{position:absolute;left:0;bottom:-1px;background:var(--bg);padding:12px 18px 0 0;font-family:var(--mono);font-size:10px;color:var(--ink-dim);letter-spacing:.22em;text-transform:uppercase}
.portrait-caption b{color:var(--accent);font-weight:500}
.portrait-num{position:absolute;top:-1px;right:0;background:var(--bg);padding:0 0 12px 18px;font-family:var(--serif);font-style:italic;color:var(--ink-dim);font-size:14px}

/* ====== 新增：作品預覽帶 ====== */
.hero-works{
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  position:relative;
}
.hero-works::before{
  content:"— Works";
  position:absolute;
  top:-1px;left:0;
  transform:translateY(-100%);
  font-family:var(--mono);font-size:10px;
  color:var(--ink-dim);letter-spacing:.22em;text-transform:uppercase;
  padding-bottom:12px;
}
.work-tile{
  padding:20px 0 24px;
  border-right:1px solid var(--line);
  position:relative;
  overflow:hidden;
  cursor:pointer;
  transition:background .4s;
}
.work-tile:last-child{border-right:none}
.work-tile::before{
  content:"";
  position:absolute;inset:0;top:auto;
  height:0;
  background:var(--bg-soft);
  transition:height .5s cubic-bezier(.2,.7,.2,1);
  z-index:0;
}
.work-tile:hover::before{height:100%}

.work-tile-inner{
  padding:0 20px;
  position:relative;z-index:1;
}
.work-num{
  font-family:var(--mono);font-size:10px;
  color:var(--ink-dim);letter-spacing:.1em;
  margin-bottom:10px;
  display:block;
}
.work-thumb{
  width:100%;aspect-ratio:3/2;
  overflow:hidden;
  background:var(--bg-card);
  margin-bottom:14px;
  border:1px solid var(--line-soft);
}
.work-thumb img{
  width:100%;height:100%;object-fit:cover;
  filter:grayscale(.5) brightness(.7);
  transition:filter .5s,transform .8s;
}
.work-tile:hover .work-thumb img{
  filter:grayscale(0) brightness(.95);
  transform:scale(1.06);
}
.work-name{
  font-family:var(--serif-cjk);
  font-size:14px;
  font-weight:400;
  color:var(--ink-mute);
  line-height:1.3;
  transition:color .3s;
}
.work-tile:hover .work-name{color:var(--accent-hi)}
.work-tag{
  font-family:var(--mono);font-size:9px;
  color:var(--ink-dim);letter-spacing:.12em;
  margin-top:6px;
  display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.work-arrow{
  position:absolute;right:12px;bottom:12px;
  font-family:var(--serif);font-style:italic;
  font-size:11px;color:var(--accent);
  opacity:0;transform:translateX(-4px);
  transition:opacity .3s,transform .3s;
  z-index:1;
}
.work-tile:hover .work-arrow{opacity:1;transform:translateX(0)}

/* ====== 下面照舊的 projects section ====== */
.section{padding:120px 0;position:relative}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:60px}
.sec-head .label{font-family:var(--mono);font-size:11px;color:var(--ink-dim);letter-spacing:.24em;text-transform:uppercase}
.sec-head h2{font-family:var(--serif-cjk);font-size:clamp(36px,5vw,56px);font-weight:300;letter-spacing:.02em;line-height:1;margin-top:8px}
.sec-head h2 em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--accent)}
.sec-head .count{font-family:var(--mono);font-size:11px;color:var(--ink-dim);letter-spacing:.24em}

.projects{display:flex;flex-direction:column}
.project{display:grid;grid-template-columns:60px 1.3fr 1fr;gap:clamp(20px,4vw,60px);align-items:center;padding:36px 0;border-top:1px solid var(--line);position:relative;cursor:pointer;transition:padding .5s cubic-bezier(.2,.7,.2,1)}
.project:last-child{border-bottom:1px solid var(--line)}
.project::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.project:hover{padding-left:18px;padding-right:18px}
.project:hover::before{transform:scaleX(1)}
.project-num{font-family:var(--mono);font-size:12px;color:var(--ink-dim);letter-spacing:.1em}
.project-info{display:flex;flex-direction:column;gap:14px}
.project-title{font-family:var(--serif-cjk);font-size:clamp(28px,3.4vw,40px);font-weight:400;line-height:1.1;letter-spacing:.02em;color:var(--ink);transition:color .4s}
.project:hover .project-title{color:var(--accent-hi)}
.project-desc{font-size:14px;color:var(--ink-mute);line-height:1.7;max-width:50ch}
.project-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.project-tag{font-family:var(--mono);font-size:10px;color:var(--ink-dim);letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--line);border-radius:999px}
.project-thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--bg-card);border:1px solid var(--line-soft)}
.project-thumb img{width:100%;height:100%;object-fit:cover;filter:grayscale(.4) brightness(.78) contrast(1.05);transition:filter .6s,transform 1.2s}
.project:hover .project-thumb img{filter:grayscale(0) brightness(1) contrast(1);transform:scale(1.04)}
.project-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(15,14,12,.5));pointer-events:none}
.project-arrow{position:absolute;right:14px;bottom:14px;font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink);background:rgba(15,14,12,.7);border:1px solid var(--line);padding:6px 14px;backdrop-filter:blur(8px);opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s;z-index:1}
.project:hover .project-arrow{opacity:1;transform:translateY(0)}
.project-arrow b{font-style:normal;margin-left:4px;color:var(--accent-hi)}

.footer{border-top:1px solid var(--line);padding:48px 0 36px;position:relative;z-index:2}
.footer-inner{max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,56px);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:18px}
.footer-l{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink-mute)}
.footer-r{font-family:var(--mono);font-size:10px;color:var(--ink-dim);letter-spacing:.22em;text-transform:uppercase}

@media(max-width:880px){
  .hero-main{grid-template-columns:1fr;gap:48px;padding-bottom:40px}
  .portrait{max-width:300px;margin:0 auto}
  .hero-works{grid-template-columns:repeat(3,1fr)}
  .work-tile:nth-child(n+4){display:none}
  .project{grid-template-columns:36px 1fr;gap:18px}
  .project-thumb{grid-column:1 / -1;margin-top:14px}
  .section{padding:80px 0}
}
@media(max-width:480px){
  .hero-works{grid-template-columns:repeat(2,1fr)}
  .work-tile:nth-child(n+3){display:none}
}
</style>
</head>
<body>

<div class="concept-badge">概念稿 · CONCEPT</div>
<div class="aurora" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="top">
  <div class="top-inner">
    <a href="#" class="brand">
      <span class="brand-mark">黑</span>
      <span>Little&nbsp;Black</span>
    </a>
    <div class="top-meta">
      <span class="dot-live"></span>
      <span>Studio · Taipei</span>
      <span id="topClock">—</span>
    </div>
  </div>
</header>

<main class="shell">
  <section class="hero">

    <!-- 上半：維持人物感，肖像縮小一點 -->
    <div class="hero-main">
      <div class="hero-l">
        <div class="hero-tag">Portfolio · MMXXVI</div>
        <h1 class="hero-title">
          <span class="ch">小</span><span class="ch">黑</span>
        </h1>
        <p class="hero-sub">還在路上，慢慢往前走，樂在其中。</p>
        <p class="hero-body">
          寫程式讓我心很靜，雖然還有很多進步空間，
          但我<strong>樂在其中</strong>。這裡放的是我做過的東西，
          每一個都代表我往前走了一步。
        </p>
      </div>

      <div class="hero-r">
        <div class="portrait">
          <div class="portrait-num">No.&nbsp;01</div>
          <div class="portrait-frame"></div>
          <div class="portrait-img">
            <img src="images/avatar2.png" alt="小黑"
                 onerror="this.parentElement.innerHTML='<div style=\'width:100%;height:100%;display:grid;place-items:center;font-family:Noto Serif TC;font-size:96px;color:var(--accent)\'>黑</div>'">
          </div>
          <div class="portrait-caption">Self&nbsp;<b>·</b>&nbsp;Portrait</div>
        </div>
      </div>
    </div>

    <!-- 新增：作品預覽帶（Hero 底部） -->
    <div class="hero-works" id="heroWorks">
      <!-- JS 填入 -->
    </div>

  </section>

  <!-- 詳細作品列表（往下滾才看到） -->
  <section class="section" id="projects">
    <div class="sec-head">
      <div>
        <div class="label">— Selected Works</div>
        <h2>專案<em>作品</em></h2>
      </div>
      <div class="count" id="projCount">05 · Works</div>
    </div>
    <div class="projects" id="projectsList"></div>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-l">— Still walking, slowly forward.</div>
    <div class="footer-r">© MMXXVI · Little Black · Concept</div>
  </div>
</footer>

<script>
(function(){
  const el=document.getElementById('topClock');
  function tick(){const d=new Date();el.textContent=`TPE ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
  tick();setInterval(tick,30000);
})();

const projects=[
  {name:"今日紫微",image:"images/projects/今日紫微-起始畫面1.jpg",link:"projects/ziwei-today.html",tags:["Kotlin","Android"]},
  {name:"廚師 AI 工具箱",image:"images/projects/廚房AI-首頁圖片.jpg",link:"projects/chef-ai-toolbox.html",tags:["Kotlin","OpenAI"]},
  {name:"人生步數",image:"images/projects/人生步數-首頁.jpg",link:"projects/life-steps.html",tags:["Kotlin","Compose"]},
  {name:"台股預測系統",image:"images/projects/stock-cover.png",link:"projects/stock-predictor.html",tags:["Python","AI"]},
  {name:"小黑工具箱",image:"images/projects/toolbox-cover.png",link:"projects/toolbox.html",tags:["Python","Flask"]}
];

/* 作品預覽帶 */
const heroWorks=document.getElementById('heroWorks');
projects.forEach((p,i)=>{
  const a=document.createElement('a');
  a.className='work-tile';
  a.href=p.link;
  a.innerHTML=`
    <div class="work-tile-inner">
      <span class="work-num">${String(i+1).padStart(2,'0')}</span>
      <div class="work-thumb">
        ${p.image?`<img src="${p.image}" alt="${p.name}" loading="lazy">`:''}
      </div>
      <div class="work-name">${p.name}</div>
      <span class="work-tag">${p.tags[0]} · ${p.tags[1]||''}</span>
    </div>
    <span class="work-arrow">→</span>`;
  heroWorks.appendChild(a);
});

/* 詳細列表 */
const list=document.getElementById('projectsList');
projects.forEach((p,i)=>{
  const a=document.createElement('a');
  a.className='project';
  a.href=p.link;
  const tags=p.tags.map(t=>`<span class="project-tag">${t}</span>`).join('');
  a.innerHTML=`
    <div class="project-num">${String(i+1).padStart(2,'0')} / ${String(projects.length).padStart(2,'0')}</div>
    <div class="project-info">
      <h3 class="project-title">${p.name}</h3>
      <div class="project-tags">${tags}</div>
    </div>
    <div class="project-thumb">
      ${p.image?`<img src="${p.image}" alt="${p.name}" loading="lazy">`:''}
      <div class="project-arrow"><span>查看詳情</span><b>→</b></div>
    </div>`;
  list.appendChild(a);
});
</script>
</body>
</html>
