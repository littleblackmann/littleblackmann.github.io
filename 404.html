<meta charset="UTF-8">

<title>404 — 小黑 Little Black</title>
<meta name="robots" content="noindex">
<link rel="shortcut icon" href="/images/favicon.png" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+TC:wght@300;400&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0e0c; --bg-soft:#15130f; --bg-card:#181613;
  --line:#2a2620; --line-soft:#1f1c17;
  --ink:#f3ede2; --ink-mute:#a39c8e; --ink-dim:#6b6557;
  --accent:#b8956a; --accent-hi:#d4b486;
  --serif:'Cormorant Garamond','Noto Serif TC',serif;
  --serif-cjk:'Noto Serif TC',serif;
  --sans:'Inter','Noto Sans TC',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-weight:300; line-height:1.6; font-size:15px;
  -webkit-font-smoothing:antialiased;
  min-height:100vh; display:grid; place-items:center; padding:24px;
}
.frame{
  max-width:560px; width:100%;
  border:1px solid var(--line);
  padding:64px 48px 56px;
  position:relative;
}
.num{
  position:absolute; top:-1px; right:0;
  background:var(--bg); padding:0 0 12px 18px;
  font-family:var(--mono); font-size:10px;
  color:var(--ink-dim); letter-spacing:.22em; text-transform:uppercase;
}
.micro{
  font-family:var(--mono); font-size:10px;
  color:var(--ink-dim); letter-spacing:.28em; text-transform:uppercase;
  margin-bottom:28px;
}
.micro::before{content:"— "; color:var(--accent)}
h1{
  font-family:var(--serif-cjk); font-weight:300;
  font-size:clamp(40px,8vw,64px); line-height:1.15;
  margin-bottom:24px;
}
h1 em{
  font-family:var(--serif); font-style:italic; font-weight:400;
  color:var(--accent);
}
p{color:var(--ink-mute); margin-bottom:40px; max-width:38em}
.back{
  display:inline-block;
  font-family:var(--mono); font-size:11px;
  letter-spacing:.22em; text-transform:uppercase;
  color:var(--ink); text-decoration:none;
  border:1px solid var(--line); padding:14px 28px;
  transition:border-color .4s, color .4s;
}
.back:hover{border-color:var(--accent); color:var(--accent-hi)}
.back span{color:var(--accent); margin-left:10px}
</style>
</head>
<body>
  <div class="frame">
    <div class="num">Err&nbsp;·&nbsp;404</div>
    <div class="micro">Page Not Found</div>
    <h1>這一頁<em>不在這裡</em></h1>
    <p>可能是連結舊了，或這一頁已經悄悄搬走。沒關係，慢慢來，先回首頁坐坐吧。</p>
    <a class="back" href="/">回到首頁<span>→</span></a>
  </div>
  <script data-goatcounter="https://littleblack.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
